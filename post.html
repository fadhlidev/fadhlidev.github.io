            font-size: 0.67rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted, #555);

        .inline-product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .inline-product-block {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
            background: var(--dark2, #111116);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.18s;

        .inline-product-block:hover {
            border-color: rgba(218, 38, 40, 0.5);
            box-shadow: 0 6px 24px rgba(218, 38, 40, 0.1);

        .inline-product-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--dark3, #0d0d12);
            overflow: hidden;
        }

        .inline-product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }

        .inline-product-block:hover .inline-product-img {
            transform: scale(1.04);
        }

        .inline-product-body {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .inline-product-eyebrow {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #da2628;
        }

        .inline-product-name {
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.4;
            color: var(--text, #e8e8ec);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;

        .inline-product-cta {

            if (!str) return "";
            try {
                return new Date(str).toLocaleDateString("en-US", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                });
            } catch {
                return "";

co.id/7AaCQ3dV3R" }, { "image": "https://down-ws-id.img.susercontent.com/id-11134207-7rbk9-m93wg95hlu6aa2.webp", "name": "Monitor Bracket Gas Spring 13-32 inch Satu ARM dan Dua ARM", "link": "https://s.shopee.co.id/6L15QQvXUP" }, { "image": "https://down-ws-id.img.susercontent.com/id-11134207-7ra0s-mb8gdb2j6t3q8a.webp", "name": "Sandaran tangan / Wrist rest / Arm rest Keyboard", "link": "https://s.shopee.co.id/LjsHIZv5D" }, { "image": "https://down-ws-id.img.susercontent.com/id-11134207-8224y-mk7trh7v356r7f.webp", "name": "Homedoki Kursi Gaming / Kursi Kantor Ergonomis Putar", "link": "https://s.shopee.co.id/9fHXNQKwoY" }, { "image": "https://down-ws-id.img.susercontent.com/id-11134207-822wi-mnw88ecedkp1b9.webp", "name": "Xpanse Meja Kerja Elektrik Adjustable Standing Desk", "link": "https://s.shopee.co.id/3LNTpePwnj" }, { "image": "https://down-ws-id.img.susercontent.com/9507a3f32a112bc2dacb07700f7b6ebe.webp", "name": "JBL Tune 510BT Wireless On-Ear Headphones with Purebass Sound", "link": "https://s.shopee.co.id/8UzGCtEgA0" }, { "image": "https://down-ws-id.img.susercontent.com/id-11134207-7r98r-lr1ijfyv72s91a.webp", "name": "Eggel Stage SoundBar / Sound Bar with Built-In Woofer", "link": "https://s.shopee.co.id/8Kfq0aFJUz" }, { "image": "https://down-ws-id.img.susercontent.com/id-11134207-7rbk4-ma3no1jpuz3ke4.webp", "name": "Rode NT-USB Mini Microphone", "link": "https://s.shopee.co.id/8AMPoHFwpy" }];

        function pickTwoRandom(arr) {
            const shuffled = [...arr].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, 2);
        }

        function buildProductCard(p) {
            return `
            <a href="${p.link}" target="_blank" rel="noopener noreferrer sponsored" class="inline-product-block">
                <div class="inline-product-img-wrap">
                    <img class="inline-product-img" src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy" />
                </div>
                <div class="inline-product-body">
                    <div class="inline-product-eyebrow">
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                        Setup saya
                    </div>
                    <div class="inline-product-name">${escapeHtml(p.name)}</div>
                    <div class="inline-product-cta">
                        Lihat di Shopee
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </div>
                </div>
            </a>`;
        }

        function injectProductsIntoContent(htmlContent) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = htmlContent;
            const paras = wrapper.querySelectorAll('p, h2, h3, figure, pre, blockquote');
            if (paras.length < 3) return htmlContent;

            const midIdx = Math.floor(paras.length / 2);
            const [p1, p2] = pickTwoRandom(PRODUCTS);

            const productBlock = document.createElement('div');
            productBlock.className = 'inline-product-pair';
            productBlock.innerHTML = `
                <div class="inline-product-pair-label">✦ Dari setup saya</div>
                <div class="inline-product-grid">
                    ${buildProductCard(p1)}
                    ${buildProductCard(p2)}
                </div>
            `;

            const refNode = paras[midIdx];
            refNode.parentNode.insertBefore(productBlock, refNode);
            return wrapper.innerHTML;
        }

        // ── Blogger: fetch single post by numeric ID ──
        // Use the single-entry endpoint by appending the numeric ID to the path.
        // This returns just the specific post data in the `entry` property.

        let jsonpTimer = null;

        window.__postCallback = function (data) {
            clearTimeout(jsonpTimer);
            const s = document.getElementById("__jsonpPost");
            if (s) s.remove();

            console.log("[post] response keys:", Object.keys(data));

            // Blogger response structure varies:
            // - ?postID= filter:         data.feed.entry[0] or data.feed.entry (object if 1 result)
            // - single-entry endpoint:   data.entry (top-level)
            let entry =
                data.entry ||
                (data.feed?.entry
                    ? Array.isArray(data.feed.entry)
                        ? data.feed.entry[0]
                        : data.feed.entry
                    : null);

            if (!entry) {
                console.warn(
                    "[post] no entry found. Full response:",
                    JSON.stringify(data).slice(0, 500),
                );
                renderError("Post not found.");
                return;
            }

            const link =
                (entry.link || []).find((l) => l.rel === "alternate")
                    ?.href || null;
            renderPost(entry, link);
        };

        function fetchPost(postId) {
            const script = document.createElement("script");
            script.id = "__jsonpPost";
            // Fetch a single post by its numeric ID using the path-based endpoint.
            const url =
                `https://fadhlidev.blogspot.com/feeds/posts/default/${postId}` +
                `?alt=json-in-script&callback=__postCallback`;
            script.src = url;

            console.log("[post] fetching:", url);

            script.onerror = () => {
                clearTimeout(jsonpTimer);
                script.remove();
                console.error(
                    "[post] script load failed — check browser Network tab",
                );
                renderError("Could not reach Blogspot.");
            };

            jsonpTimer = setTimeout(() => {
                const s = document.getElementById("__jsonpPost");
                if (s) s.remove();
                renderError("Request timed out.");
            }, 10000);

            document.head.appendChild(script);
        }

        function renderPost(entry, originalUrl) {
            const title = entry.title?.$t || "Untitled";
            const published = entry.published?.$t || "";
            const author =
                entry.author?.[0]?.name?.$t || "Fadhli Syaifullah";
            const content =
                entry.content?.$t ||
                entry.summary?.$t ||
                "<p><em>No content available.</em></p>";
            const tags = (entry.category || []).map((c) => c.term);
            const link = originalUrl || "https://fadhlidev.blogspot.com";

            document.title = `${title} – Fadhli Syaifullah`;

            const app = document.getElementById("app");
            app.innerHTML = `
      <a href="./blog.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        All posts
      </a>

      <header class="post-header">
        <span class="post-label">Article</span>
        <h1 class="post-title">${escapeHtml(title)}</h1>
        <div class="post-meta">
          <span class="post-date">${formatDate(published)}</span>
          <span class="post-author">by ${escapeHtml(author)}</span>
        </div>
        ${tags.length
                    ? `
          <div class="post-tags">
            ${tags.map((t) => `<span class="post-tag">${escapeHtml(t)}</span>`).join("")}
          </div>`
                    : ""
                }
      </header>

      <div class="post-divider"></div>

      <article class="prose-body" id="postBody"></article>

      <footer class="post-footer">
        <a href="${link}" target="_blank" rel="noopener" class="post-footer-orig">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View original on Blogspot
        </a>
        <a href="./blog.html" class="back-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to all posts
        </a>
      </footer>
    `;

            // innerHTML intentional — content is from your own Blogger blog
            // Inject 2 random product cards at midpoint of article
            const enrichedContent = injectProductsIntoContent(content);
            document.getElementById("postBody").innerHTML = enrichedContent;

            // Open external links in new tab
            document.querySelectorAll(".prose-body a").forEach((a) => {
                if (!a.href.includes(location.hostname)) {
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                }
            });
        }

        function renderError(msg) {
            const app = document.getElementById("app");
            app.innerHTML = `
      <div class="state-wrap">
        <span class="error-label">Error</span>
        <strong>${msg}</strong>
        <p>The article could not be loaded. <a href="https://fadhlidev.blogspot.com" target="_blank" rel="noopener" style="color:var(--red)">Open Blogspot directly.</a></p>
        <a href="./blog.html" class="back-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to blog
        </a>
      </div>
    `;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // ── Init ──
        const postId = getParam("id");

        if (!postId || !/^\d+$/.test(postId)) {
            renderError("No valid post ID specified.");
        } else {
            fetchPost(postId);
        }
    </script>

    <script>
        const hamburger = document.getElementById("navHamburger");
        const drawer = document.getElementById("navDrawer");
        hamburger.addEventListener("click", () => {
            hamburger.classList.toggle("open");
            drawer.classList.toggle("open");
            document.body.style.overflow = drawer.classList.contains("open")
                ? "hidden"
                : "";
        });
        document.querySelectorAll(".drawer-link").forEach((link) => {
            link.addEventListener("click", () => {
                hamburger.classList.remove("open");
                drawer.classList.remove("open");
                document.body.style.overflow = "";
            });
        });
    </script>
</body>

</html>
