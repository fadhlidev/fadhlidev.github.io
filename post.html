<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>Post – Fadhli Syaifullah</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
        <style>
            /* ── FOOTER ── */

            footer {
                background: var(--dark2);
                border-top: 1px solid var(--border);
                padding: 28px 48px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.8rem;
                color: var(--muted);
            }

            /* ── RESPONSIVE ── */

            @media (max-width: 640px) {
                nav {
                    padding: 16px 24px;
                }
                .nav-links {
                    display: none;
                }
                .page-wrap {
                    padding: 100px 24px 72px;
                }
                footer {
                    padding: 24px;
                    flex-direction: column;
                    gap: 6px;
                    text-align: center;
                }
                .post-footer {
                    flex-direction: column;
                    align-items: flex-start;
                }
            }
        </style>
    </head>
    <body>
        <!-- NAV -->
        <nav>
            <a href="/" class="nav-logo">Fadhli<span>.</span></a>
            <ul class="nav-links">
                <li><a href="/#about">About</a></li>
                <li><a href="/#skills">Skills</a></li>
                <li><a href="/#experience">Experience</a></li>
                <li><a href="/#projects">Projects</a></li>
                <li><a href="/#contact">Contact</a></li>
                <li><a href="/blog.html" class="active">Blog</a></li>
                <li>
                    <a
                        href="https://collshp.com/programming_setup"
                        class="nav-shopee"
                        target="_blank"
                        rel="noopener"
                        ><svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
                            />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <path d="M16 10a4 4 0 0 1-8 0" /></svg
                        >Programming Setup</a
                    >
                </li>
            </ul>
            <button
                class="theme-toggle"
                id="themeToggle"
                aria-label="Toggle theme"
            >
                <svg
                    class="icon-sun"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg
                ><svg
                    class="icon-moon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <button
                class="nav-hamburger"
                id="navHamburger"
                aria-label="Open menu"
            >
                <span></span><span></span><span></span>
            </button>
        </nav>

        <!-- MOBILE DRAWER -->
        <div class="nav-drawer" id="navDrawer">
            <a href="/#about" class="drawer-link">About</a>
            <a href="/#skills" class="drawer-link">Skills</a>
            <a href="/#experience" class="drawer-link">Experience</a>
            <a href="/#projects" class="drawer-link">Projects</a>
            <a href="/#contact" class="drawer-link">Contact</a>
            <a href="/blog.html" class="drawer-link active">Blog</a>
            <a
                href="https://collshp.com/programming_setup"
                class="drawer-shopee"
                target="_blank"
                rel="noopener"
                ><svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path
                        d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
                    />
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <path d="M16 10a4 4 0 0 1-8 0" /></svg
                >Programming Setup</a
            >
        </div>

        <!-- MAIN -->
        <main class="page-wrap">
            <div id="app">
                <!-- Loading state -->
                <div class="state-wrap" id="stateLoading">
                    <div class="spinner"></div>
                    <p>Fetching article…</p>
                </div>
            </div>
        </main>

        <footer>
            <span>© 2026 Fadhli Syaifullah</span>
            <span>Fullstack Developer · Sukoharjo, Indonesia</span>
        </footer>

        <script>
            // ── Theme toggle ──
            const themeToggle = document.getElementById("themeToggle");
            if (localStorage.getItem("theme") === "light")
                document.body.classList.add("light");
            themeToggle.addEventListener("click", () => {
                document.body.classList.toggle("light");
                localStorage.setItem(
                    "theme",
                    document.body.classList.contains("light")
                        ? "light"
                        : "dark",
                );
            });

            // ── Helpers ──
            function formatDate(str) {
                if (!str) return "";
                try {
                    return new Date(str).toLocaleDateString("en-US", {
                        year: "numeric",
                        month: "long",
                        day: "numeric",
                    });
                } catch {
                    return "";
                }
            }

            function getParam(key) {
                return new URLSearchParams(window.location.search).get(key);
            }

            // ── Blogger: fetch single post by numeric ID ──
            // Use the single-entry endpoint by appending the numeric ID to the path.
            // This returns just the specific post data in the `entry` property.

            let jsonpTimer = null;

            window.__postCallback = function (data) {
                clearTimeout(jsonpTimer);
                const s = document.getElementById("__jsonpPost");
                if (s) s.remove();

                console.log("[post] response keys:", Object.keys(data));

                // Blogger response structure varies:
                // - ?postID= filter:         data.feed.entry[0] or data.feed.entry (object if 1 result)
                // - single-entry endpoint:   data.entry (top-level)
                let entry =
                    data.entry ||
                    (data.feed?.entry
                        ? Array.isArray(data.feed.entry)
                            ? data.feed.entry[0]
                            : data.feed.entry
                        : null);

                if (!entry) {
                    console.warn(
                        "[post] no entry found. Full response:",
                        JSON.stringify(data).slice(0, 500),
                    );
                    renderError("Post not found.");
                    return;
                }

                const link =
                    (entry.link || []).find((l) => l.rel === "alternate")
                        ?.href || null;
                renderPost(entry, link);
            };

            function fetchPost(postId) {
                const script = document.createElement("script");
                script.id = "__jsonpPost";
                // Fetch a single post by its numeric ID using the path-based endpoint.
                const url =
                    `https://fadhlidev.blogspot.com/feeds/posts/default/${postId}` +
                    `?alt=json-in-script&callback=__postCallback`;
                script.src = url;

                console.log("[post] fetching:", url);

                script.onerror = () => {
                    clearTimeout(jsonpTimer);
                    script.remove();
                    console.error(
                        "[post] script load failed — check browser Network tab",
                    );
                    renderError("Could not reach Blogspot.");
                };

                jsonpTimer = setTimeout(() => {
                    const s = document.getElementById("__jsonpPost");
                    if (s) s.remove();
                    renderError("Request timed out.");
                }, 10000);

                document.head.appendChild(script);
            }

            function renderPost(entry, originalUrl) {
                const title = entry.title?.$t || "Untitled";
                const published = entry.published?.$t || "";
                const author =
                    entry.author?.[0]?.name?.$t || "Fadhli Syaifullah";
                const content =
                    entry.content?.$t ||
                    entry.summary?.$t ||
                    "<p><em>No content available.</em></p>";
                const tags = (entry.category || []).map((c) => c.term);
                const link = originalUrl || "https://fadhlidev.blogspot.com";

                document.title = `${title} – Fadhli Syaifullah`;

                const app = document.getElementById("app");
                app.innerHTML = `
      <a href="./blog.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        All posts
      </a>

      <header class="post-header">
        <span class="post-label">Article</span>
        <h1 class="post-title">${escapeHtml(title)}</h1>
        <div class="post-meta">
          <span class="post-date">${formatDate(published)}</span>
          <span class="post-author">by ${escapeHtml(author)}</span>
        </div>
        ${
            tags.length
                ? `
          <div class="post-tags">
            ${tags.map((t) => `<span class="post-tag">${escapeHtml(t)}</span>`).join("")}
          </div>`
                : ""
        }
      </header>

      <div class="post-divider"></div>

      <article class="prose-body" id="postBody"></article>

      <footer class="post-footer">
        <a href="${link}" target="_blank" rel="noopener" class="post-footer-orig">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View original on Blogspot
        </a>
        <a href="./blog.html" class="back-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to all posts
        </a>
      </footer>
    `;

                // innerHTML intentional — content is from your own Blogger blog
                document.getElementById("postBody").innerHTML = content;

                // Open external links in new tab
                document.querySelectorAll(".prose-body a").forEach((a) => {
                    if (!a.href.includes(location.hostname)) {
                        a.target = "_blank";
                        a.rel = "noopener noreferrer";
                    }
                });
            }

            function renderError(msg) {
                const app = document.getElementById("app");
                app.innerHTML = `
      <div class="state-wrap">
        <span class="error-label">Error</span>
        <strong>${msg}</strong>
        <p>The article could not be loaded. <a href="https://fadhlidev.blogspot.com" target="_blank" rel="noopener" style="color:var(--red)">Open Blogspot directly.</a></p>
        <a href="./blog.html" class="back-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to blog
        </a>
      </div>
    `;
            }

            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            // ── Init ──
            const postId = getParam("id");

            if (!postId || !/^\d+$/.test(postId)) {
                renderError("No valid post ID specified.");
            } else {
                fetchPost(postId);
            }
        </script>

        <script>
            const hamburger = document.getElementById("navHamburger");
            const drawer = document.getElementById("navDrawer");
            hamburger.addEventListener("click", () => {
                hamburger.classList.toggle("open");
                drawer.classList.toggle("open");
                document.body.style.overflow = drawer.classList.contains("open")
                    ? "hidden"
                    : "";
            });
            document.querySelectorAll(".drawer-link").forEach((link) => {
                link.addEventListener("click", () => {
                    hamburger.classList.remove("open");
                    drawer.classList.remove("open");
                    document.body.style.overflow = "";
                });
            });
        </script>
    </body>
</html>
